name: Build Mehrgan Android APK
run-name: Mehrgan APK ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request identifier from WordPress
        required: true
        type: string
      app_name:
        description: Android app display name
        required: true
        type: string
      package_id:
        description: Android application ID
        required: true
        type: string
      site_url:
        description: HTTPS website URL
        required: true
        type: string
      theme_color:
        description: Main theme color
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Android template
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply WordPress settings to app template
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}
          SITE_URL: ${{ inputs.site_url }}
          THEME_COLOR: ${{ inputs.theme_color }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          replacements = {
              '__APP_NAME__': os.environ['APP_NAME'],
              '__PACKAGE_ID__': os.environ['PACKAGE_ID'],
              '__SITE_URL__': os.environ['SITE_URL'],
              '__THEME_COLOR__': os.environ['THEME_COLOR'],
          }
          root = Path('android-template')
          for path in root.rglob('*'):
              if path.is_file():
                  try:
                      content = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for old, new in replacements.items():
                      content = content.replace(old, new)
                  path.write_text(content, encoding='utf-8')
          PY

      - name: Build debug APK
        working-directory: android-template
        run: gradle --no-daemon assembleDebug

      - name: Rename APK and prepare artifact
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          mkdir -p build-output
          cp android-template/app/build/outputs/apk/debug/app-debug.apk build-output/app-debug.apk
          printf 'Request: %s\nBuilt at UTC: %s\n' "$REQUEST_ID" "$(date -u +%FT%TZ)" > build-output/BUILD-INFO.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mehrgan-apk-${{ inputs.request_id }}
          path: build-output/*
          if-no-files-found: error
          retention-days: 7
